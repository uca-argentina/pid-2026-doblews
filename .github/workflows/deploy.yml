name: Deploy

# Staging always mirrors main (reglas-de-trabajo §6), so every push to main
# deploys. Nothing reaches main without a PR that passed ci.yml, which is why
# this workflow does not lint or test again. workflow_dispatch redeploys main
# by hand from the Actions tab. See ADR-008 for the Azure setup behind it.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Two merges in a row deploy one after the other, never interleaved, and a
# deploy already running is never cancelled halfway.
concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/warchitecture-backend
  RESOURCE_GROUP: rg-warchitecture
  CONTAINER_APP: ca-warchitecture-api

jobs:
  backend:
    name: Backend — image and Container App
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Push the image to GHCR and prune old versions with GITHUB_TOKEN.
      packages: write
      # OIDC token that azure/login exchanges for the id-gh-deploy managed
      # identity. No Azure password is stored in GitHub.
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          # Tagged by commit, never "latest": the Container App revision then
          # names exactly which commit it runs.
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          # One plain manifest per version. Provenance and SBOM attestations
          # would add untagged versions that the pruning step below counts.
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Point the Container App at the new image
        run: >-
          az containerapp update
          --resource-group "$RESOURCE_GROUP"
          --name "$CONTAINER_APP"
          --image "$IMAGE:${{ github.sha }}"
          --output none

      - name: Smoke test
        # The update returns once the revision is provisioned, not once the app
        # answers. Migrations run on start, so a failing one only shows up
        # here. min-replicas is 0, so the first try also pays the cold start.
        run: |
          fqdn=$(az containerapp show --resource-group "$RESOURCE_GROUP" --name "$CONTAINER_APP" \
            --query properties.configuration.ingress.fqdn --output tsv)
          for attempt in $(seq 1 12); do
            if curl --silent --fail --max-time 30 "https://$fqdn/health"; then
              exit 0
            fi
            echo "attempt $attempt: not healthy yet"
            sleep 10
          done
          echo "::error::https://$fqdn/health never answered; check the Container App logs"
          exit 1

      - name: Prune old images
        # The package is private and the free GHCR quota is 500 MB, so only
        # the image running now and the one before it (for a rollback) stay.
        uses: actions/delete-package-versions@v5
        with:
          package-name: warchitecture-backend
          package-type: container
          min-versions-to-keep: 2

  frontend:
    name: Frontend — Static Web App
    runs-on: ubuntu-latest
    # After the backend, so a change that adds an endpoint never ships a front
    # that calls it before the API has it.
    needs: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        # Vite inlines VITE_API_URL at build time; the deployed bundle cannot
        # read it at runtime.
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build

      - name: Deploy to Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          # Already built above; the action only uploads the folder.
          app_location: frontend/dist
          skip_app_build: true
          skip_api_build: true
