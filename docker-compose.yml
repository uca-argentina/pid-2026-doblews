services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: warchitecture
      POSTGRES_PASSWORD: warchitecture
      POSTGRES_DB: warchitecture
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warchitecture"]
      interval: 5s
      retries: 5

volumes:
  pgdata:
